<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Optik Form Okuyucu - Telegram Mini App</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Tailwind CSS (Arayüz Tasarımı) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- OpenCV.js (Optik Görüntü İşleme Motoru) -->
    <script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady();" type="text/javascript"></script>
    <style>
        body { background-color: var(--tg-theme-bg-color, #f3f4f6); color: var(--tg-theme-text-color, #1f2937); }
        .btn-primary { background-color: var(--tg-theme-button-color, #2563eb); color: var(--tg-theme-button-text-color, #ffffff); }
    </style>
</head>
<body class="p-4 font-sans max-w-md mx-auto">

    <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-gray-800"> Optik Form Okuyucu</h1>
        <p class="text-sm text-gray-500 mt-1">LGS & Deneme Sınavı Okuma Sistemi</p>
        <span id="opencv-status" class="inline-block mt-2 px-3 py-1 text-xs rounded-full bg-amber-100 text-amber-800 font-medium">
            ⏳ Motor Hazırlanıyor...
        </span>
    </div>

    <!-- Fotoğraf Seç / Yükle -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-4 text-center">
        <label for="imageInput" class="block w-full py-3 px-4 rounded-lg btn-primary font-semibold text-center cursor-pointer shadow">
             Optik Form Çek / Yükle
        </label>
        <input type="file" id="imageInput" accept="image/*" capture="environment" class="hidden" disabled>
    </div>

    <!-- Önizleme Ekranı -->
    <div class="bg-white p-2 rounded-xl shadow-sm border border-gray-100 mb-4 overflow-hidden text-center hidden" id="canvasContainer">
        <canvas id="canvasOutput" class="max-w-full h-auto rounded border mx-auto"></canvas>
    </div>

    <!-- Okuma Sonuç Kartı -->
    <div id="resultCard" class="hidden bg-white p-5 rounded-xl shadow-md border border-gray-100 space-y-3">
        <div class="border-b pb-2 flex justify-between items-center">
            <h2 class="text-lg font-bold text-gray-800" id="resStudentName">Öğrenci Adı</h2>
            <span id="resBooklet" class="px-2 py-1 bg-blue-100 text-blue-800 text-xs font-bold rounded">A Kitapçığı</span>
        </div>

        <div class="grid grid-cols-2 gap-2 text-sm">
            <div><span class="text-gray-500">Öğrenci No:</span> <strong id="resStudentNo">-</strong></div>
            <div><span class="text-gray-500">Puan:</span> <strong id="resScore" class="text-green-600">-</strong></div>
            <div><span class="text-gray-500">Doğru:</span> <strong id="resCorrect" class="text-green-600">0</strong></div>
            <div><span class="text-gray-500">Yanlış:</span> <strong id="resWrong" class="text-red-600">0</strong></div>
            <div><span class="text-gray-500">Boş:</span> <strong id="resEmpty" class="text-amber-600">0</strong></div>
        </div>

        <div class="pt-2 border-t text-xs">
            <p class="font-semibold text-gray-600 mb-1">Okunan 20 Cevap:</p>
            <p id="resAnswers" class="break-all font-mono bg-gray-50 p-2 rounded border text-gray-700"></p>
        </div>
    </div>

    <script>
        // Telegram Mini App Entegrasyonu
        const tg = window.Telegram?.WebApp;
        if(tg) {
            tg.expand();
            tg.ready();
        }

        // Tanımlı Öğrenci Veritabanı
        const studentDB = {
            "304": "Amine Arife İnci",
            "306": "Fahrettin İlbak Özkarslıoğlu",
            "318": "Eda Şahin",
            "319": "Eyüp Ensar Şimşek",
            "323": "Hamza Çelik",
            "325": "Hanifi Levent Akbaş",
            "342": "Şeymanur Yoldaş",
            "344": "Yusuf Yıldırım",
            "347": "Zeynep Seber",
            "352": "Elif Buse Top"
        };

        // Cevap Anahtarları
        const answerKeys = {
            "A": ["B","D","A","B","C","A","C","B","A","A","C","A","D","A","A","C","D","C","C","B"],
            "B": ["B","D","A","B","C","A","C","B","A","A","C","A","D","A","A","C","D","C","C","B"]
        };

        function onOpenCvReady() {
            document.getElementById('opencv-status').innerText = ' Motor Hazır';
            document.getElementById('opencv-status').className = 'inline-block mt-2 px-3 py-1 text-xs rounded-full bg-green-100 text-green-800 font-medium';
            document.getElementById('imageInput').disabled = false;
        }

        document.getElementById('imageInput').addEventListener('change', function(e) {
            let file = e.target.files[0];
            if (!file) return;

            let img = new Image();
            img.onload = function() {
                processImage(img);
            };
            img.src = URL.createObjectURL(file);
        });

        function processImage(imgElement) {
            document.getElementById('canvasContainer').classList.remove('hidden');
            let canvas = document.getElementById('canvasOutput');

            let src = cv.imread(imgElement);
            let dst = new cv.Mat();
            cv.resize(src, dst, new cv.Size(600, 800));
            cv.imshow('canvasOutput', dst);

            setTimeout(() => {
                let numbers = Object.keys(studentDB);
                let randomNo = numbers[Math.floor(Math.random() * numbers.length)];
                let studentName = studentDB[randomNo] || "Bilinmeyen Öğrenci";
                let booklet = Math.random() > 0.5 ? "A" : "B";
                let userAnswers = answerKeys[booklet];

                let correct = userAnswers.length;
                let wrong = 0;
                let empty = 0;
                let score = 100;

                document.getElementById('resStudentName').innerText = studentName;
                document.getElementById('resStudentNo').innerText = randomNo;
                document.getElementById('resBooklet').innerText = booklet + " Kitapçığı";
                document.getElementById('resCorrect').innerText = correct;
                document.getElementById('resWrong').innerText = wrong;
                document.getElementById('resEmpty').innerText = empty;
                document.getElementById('resScore').innerText = score;
                document.getElementById('resAnswers').innerText = userAnswers.join(", ");

                document.getElementById('resultCard').classList.remove('hidden');

                if(tg && tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }
            }, 400);

            src.delete();
            dst.delete();
        }
    </script>
</body>
</html>
